<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crucigrama de Animales</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: #121212;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

#grid {
    display: grid;
    justify-content: center;
    margin: 20px auto;
}

.cell {
    width: 40px;
    height: 40px;
    border: 1px solid #333;
    text-align: center;
    font-size: 20px;
    text-transform: uppercase;
    background: #1e1e1e;
    color: white;
}

.blocked {
    background: #000;
}

.correct {
    background: #28a745;
}

.hint {
    background: #ffc107;
    color: black;
}

#wordsList li {
    list-style: none;
}

.completed {
    text-decoration: line-through;
    color: #888;
}

button {
    margin: 10px;
}
</style>
</head>

<body>

<h1>🧩 Crucigrama de Animales</h1>

<div>
    ⏱ Tiempo: <span id="timer">0</span>s
</div>

<div id="grid"></div>

<h4>Palabras</h4>
<ul id="wordsList"></ul>

<button class="btn btn-danger" onclick="resetGame()">Reiniciar</button>

<script>

const words = ["PERRO","GATO","LEON","TIGRE","OSO","ZORRO","VACA","CABALLO"];

let gridSize = 12;
let grid = [];
let placements = [];
let timer = 0;
let interval;

// Inicializar juego
function init() {
    timer = 0;
    document.getElementById("timer").innerText = timer;

    clearInterval(interval);

    interval = setInterval(() => {
        timer++;
        document.getElementById("timer").innerText = timer;
    }, 1000);

    createEmptyGrid();
    placeWords();
    renderGrid();
    renderWordList();
}

// Crear grid vacío
function createEmptyGrid() {
    grid = Array.from({length: gridSize}, () => Array(gridSize).fill(""));
}

// Colocar palabras con cruces
function placeWords() {

    placements = [];

    words.forEach((word, index) => {

        if(index === 0) {

            placeWord(word, 5, 2, "horizontal");

        } else {

            let placed = false;

            for(let p of placements) {

                for(let i = 0; i < word.length; i++) {

                    for(let j = 0; j < p.word.length; j++) {

                        if(word[i] === p.word[j]) {

                            let row = p.row;
                            let col = p.col;

                            if(p.dir === "horizontal") {

                                row = p.row - i;
                                col = p.col + j;

                                if(canPlace(word,row,col,"vertical")) {

                                    placeWord(word,row,col,"vertical");
                                    placed = true;
                                    break;
                                }

                            } else {

                                row = p.row + j;
                                col = p.col - i;

                                if(canPlace(word,row,col,"horizontal")) {

                                    placeWord(word,row,col,"horizontal");
                                    placed = true;
                                    break;
                                }
                            }
                        }
                    }

                    if(placed) break;
                }

                if(placed) break;
            }

            if(!placed) {

                placeWord(
                    word,
                    Math.floor(Math.random()*gridSize),
                    Math.floor(Math.random()*gridSize),
                    "horizontal"
                );
            }
        }
    });
}

// Verificar si se puede colocar
function canPlace(word, row, col, dir) {

    for(let i=0;i<word.length;i++) {

        let r = row + (dir==="vertical"?i:0);
        let c = col + (dir==="horizontal"?i:0);

        if(r<0 || c<0 || r>=gridSize || c>=gridSize)
            return false;

        if(grid[r][c] !== "" && grid[r][c] !== word[i])
            return false;
    }

    return true;
}

// Colocar palabra
function placeWord(word,row,col,dir) {

    placements.push({word,row,col,dir});

    for(let i=0;i<word.length;i++) {

        let r = row + (dir==="vertical"?i:0);
        let c = col + (dir==="horizontal"?i:0);

        grid[r][c] = word[i];
    }
}

// Renderizar grid
function renderGrid() {

    const gridDiv = document.getElementById("grid");

    gridDiv.innerHTML = "";

    gridDiv.style.gridTemplateColumns =
    `repeat(${gridSize}, 40px)`;

    for(let r=0;r<gridSize;r++) {

        for(let c=0;c<gridSize;c++) {

            let input = document.createElement("input");

            input.maxLength = 1;

            input.classList.add("cell");

            if(grid[r][c] === "") {

                input.disabled = true;
                input.classList.add("blocked");

            } else {

                // pista aleatoria
                if(Math.random() < 0.2) {

                    input.value = grid[r][c];
                    input.disabled = true;
                    input.classList.add("hint");
                }

                input.dataset.correct = grid[r][c];

                input.addEventListener("input", (e)=>{

                    let val =
                    e.target.value.toUpperCase();

                    if(val !== e.target.dataset.correct) {

                        e.target.value = "";

                    } else {

                        e.target.classList.add("correct");
                        checkWords();
                    }
                });
            }

            gridDiv.appendChild(input);
        }
    }
}

// Lista de palabras
function renderWordList() {

    const ul =
    document.getElementById("wordsList");

    ul.innerHTML = "";

    words.forEach(word=>{

        let li =
        document.createElement("li");

        li.innerText = word;

        li.id = "word-"+word;

        ul.appendChild(li);
    });
}

// Verificar palabras completas
function checkWords() {

    placements.forEach(p=>{

        let correct = true;

        for(let i=0;i<p.word.length;i++) {

            let r =
            p.row + (p.dir==="vertical"?i:0);

            let c =
            p.col + (p.dir==="horizontal"?i:0);

            let inputs =
            document.querySelectorAll("#grid input");

            let index = r*gridSize + c;

            if(inputs[index].value !== p.word[i]) {

                correct = false;
                break;
            }
        }

        if(correct) {

            document
            .getElementById("word-"+p.word)
            .classList.add("completed");
        }
    });

    checkWin();
}

// Verificar victoria
function checkWin() {

    let allDone = words.every(word=>{

        return document
        .getElementById("word-"+word)
        .classList.contains("completed");
    });

    if(allDone) {

        clearInterval(interval);

        Swal.fire(
            "🎉 ¡Felicidades!",
            "Completaste el crucigrama",
            "success"
        );
    }
}

// Reiniciar
function resetGame() {
    init();
}

init();

</script>

</body>
</html>
