<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sopa de Letras PRO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f8f9fa;
font-family:Arial,sans-serif;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(12,35px);
gap:5px;
justify-content:center;
margin-top:20px;
}

.cell{
width:35px;
height:35px;
background:white;
border:1px solid #ccc;
text-align:center;
line-height:35px;
font-weight:bold;
cursor:pointer;
}

.selected{
background:#0d6efd;
color:white;
}

.found{
background:#198754;
color:white;
}

</style>
</head>

<body>

<div class="container mt-4">

<h1>🔎 Sopa de Letras PRO</h1>

<button class="btn btn-primary my-3" onclick="initGame()">
Nueva partida
</button>

<div id="wordList" class="mb-3"></div>

<div id="grid" class="grid"></div>

</div>

<script>

const sizeSopa = 12;

let gridLetters = [];

let selected = [];

let found = [];

const wordBank = [
"PERRO","GATO","SOL","LUNA","MAR",
"CIELO","ROJO","AZUL","VERDE","HTML"
];

let words = wordBank.sort(()=>0.5-Math.random()).slice(0,5);

function createGrid(){

gridLetters = Array.from(
{length:sizeSopa},
()=>Array(sizeSopa).fill("")
);

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

for(let r=0;r<sizeSopa;r++){

for(let c=0;c<sizeSopa;c++){

gridLetters[r][c]=letters[
Math.floor(Math.random()*letters.length)
];

}

}

}

function draw(){

const g=document.getElementById("grid");

g.innerHTML="";

gridLetters.forEach((row,r)=>{

row.forEach((letter,c)=>{

const div=document.createElement("div");

div.className="cell";

div.textContent=letter;

div.onclick=()=>{

div.classList.toggle("selected");

};

g.appendChild(div);

});

});

}

function initGame(){

createGrid();

draw();

document.getElementById("wordList").innerHTML=
words.map(w=>
`<span class="badge bg-secondary m-1">${w}</span>`
).join("");

}

initGame();

</script>

</body>
</html>
