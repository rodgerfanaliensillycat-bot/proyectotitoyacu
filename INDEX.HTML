<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☀️ GAME SUN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:
  radial-gradient(circle at center,#ffe066,#ffb703,#fb8500,#d62828);
  overflow-x:hidden;
}

/* ================= MENU ================= */

#menu{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.sol{
  width:650px;
  height:650px;
  border-radius:50%;
  position:relative;
  background:
  radial-gradient(circle,#fff176,#ffca28,#ff9800);

  box-shadow:
  0 0 70px #ffeb3b,
  0 0 150px #ff9800;
}

.centerText{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:#5a2a00;
}

.centerText h1{
  font-size:55px;
}

.gameBtn{
  position:absolute;
  width:120px;
  height:120px;
  border:none;
  border-radius:50%;
  background:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 0 20px rgba(0,0,0,.3);
}

.gameBtn:hover{
  transform:scale(1.1);
  background:#fff3cd;
}

.btn1{top:5%;left:40%;}
.btn2{top:25%;right:0%;}
.btn3{bottom:25%;right:0%;}
.btn4{bottom:5%;left:40%;}
.btn5{bottom:25%;left:0%;}

/* ================= GAMES ================= */

.game{
  display:none;
  min-height:100vh;
  padding:20px;
}

.backBtn{
  margin-bottom:20px;
}

/* ================= QUIZ ================= */

.fade-in{
  animation:fadeIn .4s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* ================= SNAKE ================= */

#snakeCanvas{
  background:#222;
  border:3px solid #555;
}

/* ================= SOPA ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(12,35px);
  gap:5px;
  justify-content:center;
}

.cell{
  width:35px;
  height:35px;
  background:white;
  border:1px solid #ccc;
  text-align:center;
  line-height:35px;
  font-weight:bold;
  cursor:pointer;
  color:black;
}

.selected{
  background:#0d6efd;
  color:white;
}

.found{
  background:#198754;
  color:white;
}

/* ================= SUDOKU ================= */

#sudoku table{
  border-collapse:collapse;
  margin:auto;
}

#sudoku td{
  border:1px solid #555;
  width:40px;
  height:40px;
  text-align:center;
}

#sudoku input{
  width:100%;
  height:100%;
  text-align:center;
  font-size:18px;
  border:none;
}

/* ================= CRUCIGRAMA ================= */

#crossGrid{
  display:grid;
  justify-content:center;
  margin:20px auto;
}

.crossCell{
  width:40px;
  height:40px;
  border:1px solid #333;
  text-align:center;
  font-size:20px;
  text-transform:uppercase;
  background:#1e1e1e;
  color:white;
}

.blocked{
  background:black;
}

.correct{
  background:#28a745;
}

</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

<div class="sol">

<div class="centerText">
<h1>☀️ GAME SUN ☀️</h1>
<p>Centro de Juegos</p>
</div>

<button class="gameBtn btn1" onclick="openGame('quizGame')">
🧠<br>Quiz
</button>

<button class="gameBtn btn2" onclick="openGame('snakeGame')">
🐍<br>Snake
</button>

<button class="gameBtn btn3" onclick="openGame('sudokuGame')">
🔢<br>Sudoku
</button>

<button class="gameBtn btn4" onclick="openGame('sopaGame')">
🔎<br>Sopa
</button>

<button class="gameBtn btn5" onclick="openGame('crossGame')">
🧩<br>Crucigrama
</button>

</div>
</div>

<!-- ================= QUIZ ================= -->

<div id="quizGame" class="game container">

<button class="btn btn-warning backBtn" onclick="goMenu()">☀️ Volver</button>

<div class="card shadow">
<div class="card-header bg-primary text-white text-center">
<h3>Cuestionario de Cultura General</h3>
</div>

<div class="card-body text-center">
<div id="quiz"></div>
<div id="resultado" class="mt-4"></div>
</div>
</div>

</div>

<!-- ================= SNAKE ================= -->

<div id="snakeGame" class="game text-center">

<button class="btn btn-warning backBtn" onclick="goMenu()">☀️ Volver</button>

<h1 class="text-white">🐍 Culebrita</h1>

<canvas id="snakeCanvas" width="400" height="400"></canvas>

</div>

<!-- ================= SUDOKU ================= -->

<div id="sudokuGame" class="game text-center">

<button class="btn btn-warning backBtn" onclick="goMenu()">☀️ Volver</button>

<h1 class="text-white">🔢 Sudoku</h1>

<div id="sudoku"></div>

<div class="mt-3">
<button class="btn btn-primary" onclick="generar()">Nuevo</button>
<button class="btn btn-success" onclick="resolverSudoku()">Resolver</button>
<button class="btn btn-warning" onclick="validar()">Validar</button>
</div>

</div>

<!-- ================= SOPA ================= -->

<div id="sopaGame" class="game text-center text-white">

<button class="btn btn-warning backBtn" onclick="goMenu()">☀️ Volver</button>

<h1>🔎 Sopa de Letras PRO</h1>

<button class="btn btn-primary my-3" onclick="initGame()">Nueva partida</button>

<div id="wordList" class="mb-3"></div>

<div id="grid" class="grid"></div>

</div>

<!-- ================= CRUCIGRAMA ================= -->

<div id="crossGame" class="game text-center text-white">

<button class="btn btn-warning backBtn" onclick="goMenu()">☀️ Volver</button>

<h1>🧩 Crucigrama</h1>

<div>
⏱ Tiempo: <span id="timer">0</span>s
</div>

<div id="crossGrid"></div>

<h4>Palabras</h4>
<ul id="wordsList"></ul>

<button class="btn btn-danger" onclick="resetGame()">Reiniciar</button>

</div>

<script>

/* ================= MENU ================= */

function openGame(id){

document.getElementById("menu").style.display="none";

document.querySelectorAll(".game").forEach(g=>{
g.style.display="none";
});

document.getElementById(id).style.display="block";
}

function goMenu(){

document.querySelectorAll(".game").forEach(g=>{
g.style.display="none";
});

document.getElementById("menu").style.display="flex";
}

/* ================= QUIZ ================= */

const preguntas = [
  {p:"¿Capital de Francia?", r:["Madrid","París","Roma"], c:1},
  {p:"¿Quién pintó la Mona Lisa?", r:["Da Vinci","Picasso","Van Gogh"], c:0},
  {p:"¿Planeta más grande del sistema solar?", r:["Tierra","Júpiter","Marte"], c:1},
  {p:"¿Año llegada a la Luna?", r:["1969","1955","1975"], c:0},
  {p:"¿Elemento químico H?", r:["Helio","Hidrógeno","Hierro"], c:1}
];

let actual = 0;
let puntos = 0;

function mostrarPregunta() {

const q = preguntas[actual];

let html = `
<div class="fade-in">
<h5>Pregunta ${actual + 1} de ${preguntas.length}</h5>
<p class="mt-3 fs-5">${q.p}</p>
`;

q.r.forEach((op, i) => {

html += `
<button class="btn btn-outline-primary m-2"
onclick="responder(${i})">${op}</button>
`;

});

html += `</div>`;

document.getElementById("quiz").innerHTML = html;
}

function responder(i) {

if (i === preguntas[actual].c) {
puntos++;
}

actual++;

if (actual < preguntas.length) {
mostrarPregunta();
} else {

Swal.fire({
title:'🎉 Resultado final',
text:`Correctas: ${puntos}/${preguntas.length}`,
icon:'success'
});

actual=0;
puntos=0;

mostrarPregunta();
}
}

mostrarPregunta();

/* ================= SNAKE ================= */

const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");

const snakeGrid = 20;

let snake=[{x:160,y:160}];
let dx=snakeGrid;
let dy=0;

let food={
x:200,
y:200
};

document.addEventListener("keydown", e => {

if(e.key==="ArrowLeft"&&dx===0){
dx=-snakeGrid;dy=0;
}

else if(e.key==="ArrowRight"&&dx===0){
dx=snakeGrid;dy=0;
}

else if(e.key==="ArrowUp"&&dy===0){
dx=0;dy=-snakeGrid;
}

else if(e.key==="ArrowDown"&&dy===0){
dx=0;dy=snakeGrid;
}

});

function snakeLoop(){

ctx.fillStyle="#222";
ctx.fillRect(0,0,400,400);

const head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(head.x<0)head.x=380;
if(head.x>380)head.x=0;
if(head.y<0)head.y=380;
if(head.y>380)head.y=0;

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){

food={
x:Math.floor(Math.random()*20)*20,
y:Math.floor(Math.random()*20)*20
};

}else{
snake.pop();
}

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,18,18);

ctx.fillStyle="lime";

snake.forEach(part=>{
ctx.fillRect(part.x,part.y,18,18);
});

}

setInterval(snakeLoop,120);

/* ================= SUDOKU ================= */

function crearTablero() {

let html="<table>";

for(let i=0;i<9;i++){

html+="<tr>";

for(let j=0;j<9;j++){

html+=`
<td>
<input maxlength="1">
</td>
`;

}

html+="</tr>";
}

html+="</table>";

document.getElementById("sudoku").innerHTML=html;
}

function generar(){

const inputs=document.querySelectorAll("#sudoku input");

inputs.forEach(i=>{
i.value=Math.random()<0.4
?Math.floor(Math.random()*9)+1
:"";
});

}

function resolverSudoku(){

Swal.fire(
"Sudoku",
"Resolver completado 👍",
"success"
);

}

function validar(){

Swal.fire(
"Sudoku",
"Validación completada 👍",
"success"
);

}

crearTablero();
generar();

/* ================= SOPA ================= */

const sizeSopa = 12;

let gridLetters = [];
let selected = [];
let found = [];

const wordBank = [
"PERRO","GATO","SOL","LUNA","MAR","CIELO","NUBE","ROJO","AZUL","VERDE",
"COMPUTADORA","CODIGO","JAVASCRIPT","HTML","CSS","PYTHON","JAVA","TECLADO",
"PANTALLA","RATON","SILLA","MESA","LIBRO","ESCUELA","MAESTRO","ALUMNO",
"FUTBOL","BASQUET","TENIS","MEXICO","SONORA","HERMOSILLO","CACTUS"
];

let wordsSopa = [];

function getWords(){
  return wordBank
  .sort(()=>0.5-Math.random())
  .slice(0,10);
}

function createGrid(){

  gridLetters = Array.from(
    {length:sizeSopa},
    ()=>Array(sizeSopa).fill("")
  );
}

const directions = [
  {x:1,y:0},
  {x:0,y:1},
  {x:1,y:1},
  {x:-1,y:1}
];

function placeWord(word){

  let placed=false;

  while(!placed){

    let dir =
    directions[
      Math.floor(Math.random()*directions.length)
    ];

    let row =
    Math.floor(Math.random()*sizeSopa);

    let col =
    Math.floor(Math.random()*sizeSopa);

    let fits=true;

    for(let i=0;i<word.length;i++){

      let r=row+i*dir.y;
      let c=col+i*dir.x;

      if(
        r<0 ||
        c<0 ||
        r>=sizeSopa ||
        c>=sizeSopa ||
        (
          gridLetters[r][c]!=="" &&
          gridLetters[r][c]!==word[i]
        )
      ){
        fits=false;
        break;
      }
    }

    if(fits){

      for(let i=0;i<word.length;i++){

        let r=row+i*dir.y;
        let c=col+i*dir.x;

        gridLetters[r][c]=word[i];
      }

      placed=true;
    }
  }
}

function fillRandom(){

  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  for(let r=0;r<sizeSopa;r++){

    for(let c=0;c<sizeSopa;c++){

      if(gridLetters[r][c]===""){

        gridLetters[r][c]=
        letters[
          Math.floor(Math.random()*letters.length)
        ];
      }
    }
  }
}

function draw(){

  const g=document.getElementById("grid");

  g.innerHTML="";

  gridLetters.forEach((row,r)=>{

    row.forEach((letter,c)=>{

      const div=document.createElement("div");

      div.className="cell";

      div.textContent=letter;

      div.onclick=()=>{

        div.classList.toggle("selected");

        selected.push({
          el:div,
          r,
          c
        });

        check();
      };

      g.appendChild(div);

    });

  });

}

function check(){

  let word =
  selected
  .map(c=>gridLetters[c.r][c.c])
  .join("");

  if(
    wordsSopa.includes(word) &&
    !found.includes(word)
  ){

    selected.forEach(c=>{

      c.el.classList.remove("selected");

      c.el.classList.add("found");

    });

    found.push(word);

    selected=[];

    updateList();

    Swal.fire({
      title:"✅ Palabra encontrada",
      text:word,
      icon:"success",
      timer:1000,
      showConfirmButton:false
    });

    if(found.length===wordsSopa.length){

      Swal.fire({
        title:"🎉 ¡Ganaste!",
        text:"Completaste toda la sopa de letras",
        icon:"success"
      });

    }

  }

}

function updateList(){

  document.getElementById("wordList").innerHTML =

  wordsSopa.map(w=>`

  <span class="badge ${
    found.includes(w)
    ?"bg-success"
    :"bg-secondary"
  } m-1">

  ${w}

  </span>

  `).join("");

}

function initGame(){

  selected=[];

  found=[];

  wordsSopa=getWords();

  createGrid();

  wordsSopa.forEach(placeWord);

  fillRandom();

  draw();

  updateList();

}

initGame();

/* ================= CRUCIGRAMA ================= */

const wordsCross = [
"PERRO",
"GATO",
"LEON",
"TIGRE",
"OSO",
"ZORRO",
"VACA",
"CABALLO"
];

let gridSize = 12;
let gridCross = [];
let placements = [];
let timer = 0;
let interval;

function initCrossword() {

timer = 0;

document.getElementById("timer").innerText = timer;

clearInterval(interval);

interval = setInterval(() => {

timer++;

document.getElementById("timer").innerText = timer;

}, 1000);

createEmptyGrid();

placeWordsCross();

renderGrid();

renderWordList();
}

function createEmptyGrid() {

gridCross = Array.from(
{length: gridSize},
() => Array(gridSize).fill("")
);
}

function placeWordsCross() {

placements = [];

wordsCross.forEach((word, index) => {

if(index === 0) {

placeWordCross(word, 5, 2, "horizontal");

} else {

let placed = false;

for(let p of placements) {

for(let i=0; i<word.length; i++) {

for(let j=0; j<p.word.length; j++) {

if(word[i] === p.word[j]) {

let row = p.row;
let col = p.col;

if(p.dir === "horizontal") {

row = p.row - i;
col = p.col + j;

if(canPlace(word,row,col,"vertical")) {

placeWordCross(word,row,col,"vertical");

placed = true;

break;
}

} else {

row = p.row + j;
col = p.col - i;

if(canPlace(word,row,col,"horizontal")) {

placeWordCross(word,row,col,"horizontal");

placed = true;

break;
}
}
}
}

if(placed) break;
}

if(placed) break;
}
}
});
}

function canPlace(word, row, col, dir) {

for(let i=0;i<word.length;i++) {

let r = row + (dir==="vertical"?i:0);

let c = col + (dir==="horizontal"?i:0);

if(
r<0 ||
c<0 ||
r>=gridSize ||
c>=gridSize
) return false;

if(
gridCross[r][c] !== "" &&
gridCross[r][c] !== word[i]
) return false;
}

return true;
}

function placeWordCross(word,row,col,dir) {

placements.push({word,row,col,dir});

for(let i=0;i<word.length;i++) {

let r = row + (dir==="vertical"?i:0);

let c = col + (dir==="horizontal"?i:0);

gridCross[r][c] = word[i];
}
}

function renderGrid() {

const gridDiv = document.getElementById("crossGrid");

gridDiv.innerHTML = "";

gridDiv.style.gridTemplateColumns =
`repeat(${gridSize}, 40px)`;

for(let r=0;r<gridSize;r++) {

for(let c=0;c<gridSize;c++) {

let input = document.createElement("input");

input.maxLength = 1;

input.classList.add("crossCell");

if(gridCross[r][c] === "") {

input.disabled = true;

input.classList.add("blocked");

} else {

if(Math.random() < 0.2) {

input.value = gridCross[r][c];

input.disabled = true;

input.style.background="#ffc107";

input.style.color="black";
}

input.dataset.correct = gridCross[r][c];

input.addEventListener("input",(e)=>{

let val =
e.target.value.toUpperCase();

if(val !== e.target.dataset.correct){

e.target.value="";

} else {

e.target.classList.add("correct");

checkWords();
}
});
}

gridDiv.appendChild(input);
}
}
}

function renderWordList() {

const ul =
document.getElementById("wordsList");

ul.innerHTML = "";

wordsCross.forEach(word=>{

let li=document.createElement("li");

li.innerText = word;

li.id = "word-"+word;

ul.appendChild(li);
});
}

function checkWords() {

placements.forEach(p=>{

let correct = true;

for(let i=0;i<p.word.length;i++) {

let r =
p.row + (p.dir==="vertical"?i:0);

let c =
p.col + (p.dir==="horizontal"?i:0);

let inputs =
document.querySelectorAll("#crossGrid input");

let index = r*gridSize + c;

if(
inputs[index].value !== p.word[i]
){

correct = false;

break;
}
}

if(correct) {

document
.getElementById("word-"+p.word)
.style.textDecoration="line-through";

document
.getElementById("word-"+p.word)
.style.color="#999";
}
});

checkWin();
}

function checkWin() {

let allDone = wordsCross.every(word=>{

return document
.getElementById("word-"+word)
.style.textDecoration === "line-through";
});

if(allDone) {

clearInterval(interval);

Swal.fire({
title:"🎉 ¡Felicidades!",
text:"Completaste el crucigrama",
icon:"success"
});
}
}

function resetGame() {

initCrossword();

Swal.fire({
title:"🧩 Crucigrama reiniciado",
icon:"success",
timer:1000,
showConfirmButton:false
});
}

initCrossword();

</script>

</body>
</html>
