<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sudoku</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

table{
border-collapse:collapse;
margin:auto;
}

td{
border:1px solid #555;
width:40px;
height:40px;
}

input{
width:100%;
height:100%;
text-align:center;
font-size:18px;
border:none;
}

button{
margin:10px;
padding:10px 20px;
}

</style>
</head>

<body>

<h1>🔢 Sudoku</h1>

<div id="sudoku"></div>

<button onclick="generar()">
Nuevo
</button>

<script>

function crear(){

let html="<table>";

for(let i=0;i<9;i++){

html+="<tr>";

for(let j=0;j<9;j++){

html+=`
<td>
<input maxlength="1">
</td>
`;

}

html+="</tr>";
}

html+="</table>";

document.getElementById("sudoku").innerHTML=html;
}

function generar(){

const inputs=
document.querySelectorAll("input");

inputs.forEach(i=>{

i.value=Math.random()<0.4
?Math.floor(Math.random()*9)+1
:"";

});

Swal.fire(
"Sudoku",
"Nuevo tablero generado",
"success"
);

}

crear();

generar();

</script>

</body>
</html>
